<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/dist/script.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>PicoIPCameraD dashboard</title>
  </head>
  <body>
    <h1>PicoIPCameraD dashboard</h1>
    <h2>Previews</h2>
    <div class="camera-previews">
      <div>
        <p>Left</p>
        <img src="http://192.168.0.245:9100/left" />
      </div>
      <div>
        <p>Right</p>
        <img src="http://192.168.0.245:9100/right" />
      </div>
      <div>
        <p>Face</p>
        <img src="http://192.168.0.245:9100/face" />
      </div>
    </div>

    <h2>Settings</h2>
    <div class="settings">
      <div class="settings-entry">
        <label>ISO</label>
        <input type="number" max="1600" value="300" />
      </div>
      <div class="settings-entry">
        <label>Face LED brightness</label>
        <input type="number" max="40" value="40" />
      </div>
      <div class="settings-entry">
        <label>Eye LED brightness</label>
        <input type="number" max="10" value="10" />
      </div>
    </div>

    <button style="margin-top: 1rem">Save</button>
  </body>
</html>
